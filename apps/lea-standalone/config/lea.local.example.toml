# Copy this file to config/lea.local.toml.
#
# This is the single config file for the whole app (architecture D1·cfg). The
# adapter reads it into one LeaConfig and drives the vendored prover in-process —
# there is no separate Lea API process or URL anymore.

model = "gemini/gemini-3.1-pro-preview"
max_turns = 20
max_spend_usd = 25.0
narrate_tool_steps = true

# lea_root is the directory proof files + per-session git repos live under,
# relative to the repo root. For the bundled local app, "prover" is expected.
lea_root = "prover"

# Provider credentials. Set the key for whichever provider your `model` uses.
# The adapter exports these to the process environment (where LiteLLM reads
# them); they are never stored on the config object. You can also export them
# in your shell instead of here. NEVER commit your real key.
# google_api_key = "..."
# anthropic_api_key = "..."
# openai_api_key = "..."
# Any other provider works too, keyed by its LiteLLM env var name:
# MISTRAL_API_KEY = "..."
#
# Portkey AI gateway. Select a gateway model as `portkey/<catalog-name>` — the
# catalog name is exactly what your gateway expects (typically `@provider-slug/model`):
#   model = "portkey/@vertexai-jdoe/anthropic.claude-opus-4-8"
# PORTKEY_BASE_URL is the gateway's /v1 root (a self-hosted gateway such as your
# institution's); omit it for Portkey's hosted service. The Settings page edits both.
# PORTKEY_API_KEY = "..."
# PORTKEY_BASE_URL = "https://your-gateway.example.edu/v1"

# Self-hosted / OpenAI-compatible servers (Settings → Providers → Self-hosted
# servers edits these). `hosted_vllm/<model>` needs HOSTED_VLLM_API_BASE and no key;
# `ollama/<model>` uses OLLAMA_API_BASE; OPENAI_BASE_URL redirects `openai/<model>`.
# HOSTED_VLLM_API_BASE = "http://localhost:8000/v1"
# HOSTED_VLLM_API_KEY = "optional"
# OLLAMA_API_BASE = "http://localhost:11434"
# OPENAI_BASE_URL = "http://localhost:1234/v1"

# Any other environment variable the backend or LiteLLM reads, instead of
# exporting it in a shell (Settings → Environment edits this table). Exported
# for every run; the file wins over the shell. Names the app manages (PATH,
# LEA_PROCESS_ROLE, …) are ignored.
# [environment]
# LEA_JOB_TIMEOUT_SECONDS = "1800"
# HTTPS_PROXY = "http://proxy.example.edu:3128"
