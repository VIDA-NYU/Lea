[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lea"]

[project]
name = "lea-prover"
version = "0.1.0"
description = "A minimal Lean 4 theorem proving agent"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic==0.109.2",
    "google-genai==2.8.0",
    "openai==2.41.1",
    # 1.88.1 adds the Chat→Responses bridge used by GPT-5.6 reasoning + tools.
    "litellm==1.88.1",
    "mcp==1.28.0",
    "pyyaml==6.0.3",  # declarative agent profiles (item 19); used directly by lea/profiles.py
]

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.4.0",
    "httpx==0.28.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
