[project]
name = "lea-interface-server"
version = "0.1.0"
description = "Database-only FastAPI API and separately owned Lea workspace worker."
# Both entrypoints share this environment. Only the private worker imports the
# prover library, which requires Python >=3.13.
requires-python = ">=3.13"
dependencies = [
  "certifi>=2024.8.30",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.8.0",
  # 1.88.1 adds the Chat→Responses bridge used by GPT-5.6 reasoning + tools.
  "litellm>=1.88.1,<2.0.0",
  # Project file uploads (D27, Slice 4): python-multipart is what FastAPI needs to
  # parse multipart/form-data uploads; pdfminer.six + python-docx do the Tier-2
  # text extraction (.pdf/.docx → .txt sidecar) the agent reads via read_file.
  "python-multipart>=0.0.9",
  "pdfminer.six>=20240706",
  "python-docx>=1.1.0",
  # The private worker imports the vendored prover as a library. Editable path
  # dependency so worker edits under prover/lea need no re-sync.
  "lea-prover",
  "alembic>=1.18.5",
]

[tool.uv.sources]
lea-prover = { path = "../prover", editable = true }

[dependency-groups]
dev = [
  "pytest>=8.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
