# Build the same roles from this checkout; no volume recreation is required.
x-build: &build
  context: ../..
  dockerfile: apps/lea-standalone/Dockerfile
services:
  migrate:
    build:
      <<: *build
      target: worker
    image: leaui:local
    pull_policy: build
  lea:
    build:
      <<: *build
      target: api
    image: leaui-api:local
    pull_policy: build
  worker:
    build:
      <<: *build
      target: worker
    image: leaui:local
    pull_policy: build
  companion:
    build:
      <<: *build
      target: companion
    image: leaui-companion:local
    pull_policy: build
