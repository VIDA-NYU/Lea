# Explicitly publish matching API, worker and stateless companion images.

name: Publish container image

on:
  # Merging and tagging must not publish. Dispatch only for an approved release.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/vida-nyu/leaui

jobs:
  validation:
    uses: ./.github/workflows/application-ci.yml
    permissions:
      contents: read

  build:
    needs: validation
    permissions:
      contents: read
      packages: write
    timeout-minutes: 180
    strategy:
      fail-fast: true
      matrix:
        role: [worker, api, companion]
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Prepare platform slug
        run: |
          platform="${{ matrix.platform }}"
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
          selected_image="$IMAGE"
          if [ "${{ matrix.role }}" != worker ]; then selected_image="$IMAGE-${{ matrix.role }}"; fi
          echo "ROLE_IMAGE=$selected_image" >> "$GITHUB_ENV"

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          df -h /

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          name: stage8-qualified-binaries-${{ matrix.arch }}
          path: /tmp/qualified

      - name: Verify and load the exact qualified role bundle
        env:
          ROLE: ${{ matrix.role }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          (cd /tmp/qualified && sha256sum -c SHA256SUMS)
          gzip -dc /tmp/qualified/strict-bundles.tar.gz | docker load
          qualified_id=$(python3 .github/scripts/verify-release-bundle.py \
            --directory /tmp/qualified --source "$GITHUB_SHA" --arch "$ARCH" --role "$ROLE")
          echo "QUALIFIED_ID=$qualified_id" >> "$GITHUB_ENV"

      - name: Push the qualified binary without rebuilding
        env:
          ROLE: ${{ matrix.role }}
        run: |
          set -euo pipefail
          qualified_tag="$ROLE_IMAGE:qualified-$GITHUB_SHA-$PLATFORM_PAIR"
          docker tag "$QUALIFIED_ID" "$qualified_tag"
          docker push "$qualified_tag"
          echo "QUALIFIED_TAG=$qualified_tag" >> "$GITHUB_ENV"

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          python3 - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          record=json.loads(subprocess.check_output(['docker','image','inspect',os.environ['QUALIFIED_TAG']],text=True))[0]
          assert record['Id']==os.environ['QUALIFIED_ID']
          digests={v.split('@')[1] for v in record['RepoDigests'] if v.startswith(os.environ['ROLE_IMAGE']+'@')}
          assert len(digests)==1,digests
          Path('/tmp/digests',next(iter(digests)).removeprefix('sha256:')).touch()
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.role }}-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    strategy:
      matrix:
        role: [worker, api, companion]
    permissions:
      contents: read
      packages: write
    timeout-minutes: 30
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Select role image
        run: |
          selected_image="$IMAGE"
          if [ "${{ matrix.role }}" != worker ]; then selected_image="$IMAGE-${{ matrix.role }}"; fi
          echo "ROLE_IMAGE=$selected_image" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.role }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ROLE_IMAGE }}
          tags: |
            type=sha,format=long

      - name: Create multi-architecture manifest
        working-directory: /tmp/digests
        run: |
          python3 - <<'PY'
          import json,os,re,subprocess
          from pathlib import Path
          tags=json.loads(os.environ['DOCKER_METADATA_OUTPUT_JSON'])['tags']
          digests=sorted(p.name for p in Path('.').iterdir())
          assert tags and len(digests)==2 and all(re.fullmatch('[0-9a-f]{64}',d) for d in digests)
          command=['docker','buildx','imagetools','create']
          for tag in tags:command.extend(['-t',tag])
          command.extend(os.environ['ROLE_IMAGE']+'@sha256:'+digest for digest in digests)
          subprocess.run(command,check=True)
          PY

      - name: Verify published image
        run: docker buildx imagetools inspect "$ROLE_IMAGE:${{ steps.meta.outputs.version }}"

      - name: Write publication summary
        run: |
          echo "Published \`$ROLE_IMAGE:${{ steps.meta.outputs.version }}\` for linux/amd64 and linux/arm64." >> "$GITHUB_STEP_SUMMARY"

  prepare-release:
    if: github.ref == 'refs/heads/main'
    needs: merge
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Verify anonymous access, both architectures and all source identities
        run: python3 .github/scripts/verify-published-images.py --source "$GITHUB_SHA" --output /tmp/lea-image-digests.json
      - name: Assemble the pinned download and matching extension
        run: python3 .github/scripts/package-download.py --source "$GITHUB_SHA" --digests /tmp/lea-image-digests.json --output release-download
      - name: Retain the verified release download
        uses: actions/upload-artifact@v4
        with:
          name: lea-release-download
          path: release-download
          retention-days: 30

  smoke-release:
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: lea-release-download
          path: release-download
      - name: Check the exact downloadable bytes
        run: cd release-download && sha256sum -c SHA256SUMS
      - name: Anonymous pull and fresh Compose installation on the native architecture
        run: python3 .github/scripts/smoke-download.py --archive release-download/Lea.zip --source "$GITHUB_SHA" --output smoke-${{ matrix.arch }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-download-smoke-${{ matrix.arch }}
          path: smoke-${{ matrix.arch }}.json

  release:
    needs: smoke-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: actions/download-artifact@v4
        with:
          name: lea-release-download
          path: release-download
      - name: Check the qualified download before promotion
        run: cd release-download && sha256sum -c SHA256SUMS
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote the complete bundle and publish its download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
          tag="release-${GITHUB_SHA:0:12}"
          if gh release view "$tag" >/dev/null 2>&1; then
            mkdir -p /tmp/lea-prior-release
            gh release download "$tag" --pattern release.json --dir /tmp/lea-prior-release
            cmp release-download/release.json /tmp/lea-prior-release/release.json
          fi
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          manifest=json.loads(Path('release-download/release.json').read_text())
          for reference in manifest['images'].values():
              image=reference.split('@')[0]
              subprocess.run(['docker','buildx','imagetools','create','-t',image+':main',reference],check=True)
          PY
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" release-download/* \
              --target "$GITHUB_SHA" --title "Lea ${GITHUB_SHA:0:12}" \
              --notes-file release-download/README.txt --latest
          fi
